packages:
  - "apps/*"
  - "packages/*"

# Expo SDK 54 @expo/cli가 pnpm 격리 설치에서 metro를 못 찾는 문제 대응 — metro 계열만 루트로 호이스팅
publicHoistPattern:
  - "*metro*"
# 빌드 스크립트 실행을 허용할 의존성 (pnpm 11: onlyBuiltDependencies → allowBuilds 맵으로 대체)
allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: true
  esbuild: true
