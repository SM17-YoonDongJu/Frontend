name: AI Audit

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ai-audit
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  TRACKING_ISSUE: 204

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: last-audit 태그 확인 및 커밋 수 계산
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if ! git rev-parse -q --verify refs/tags/last-audit >/dev/null; then
            echo "last-audit 태그가 없어 현재 HEAD(${GITHUB_SHA})에 생성하고 종료합니다."
            git tag last-audit HEAD
            git push origin last-audit
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count last-audit..HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "last-audit 이후 커밋 수: $COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "20 미만이므로 AI 점검을 실행하지 않고 종료합니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 점검 컨텍스트 수집
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/audit
          # diff는 프롬프트 폭주 방지로 300KB에서 자른다 (잘리면 말미에 표식)
          git diff last-audit..HEAD > /tmp/audit/diff-full.patch
          head -c 300000 /tmp/audit/diff-full.patch > /tmp/audit/diff.patch
          if [ "$(wc -c < /tmp/audit/diff-full.patch)" -gt 300000 ]; then
            echo "... (diff가 300KB를 초과해 잘렸습니다. 필요 시 파일을 직접 읽어 확인)" >> /tmp/audit/diff.patch
          fi
          git diff --name-only --diff-filter=A last-audit..HEAD -- 'apps/web/src/app/**/page.tsx' > /tmp/audit/new-pages.txt
          gh issue view "$TRACKING_ISSUE" --json body -q .body > /tmp/audit/issue-body.md

      - name: 프롬프트 조립
        if: steps.gate.outputs.run == 'true'
        env:
          AUDIT_COUNT: ${{ steps.gate.outputs.count }}
        run: |
          {
            cat .github/ai-audit-prompt.md
            echo
            echo "---"
            echo
            echo "## 이번 점검 대상: last-audit..HEAD (${AUDIT_COUNT}커밋)"
            echo
            echo "## 새로 추가된 page.tsx"
            if [ -s /tmp/audit/new-pages.txt ]; then cat /tmp/audit/new-pages.txt; else echo "(없음)"; fi
            echo
            echo "## 추적 이슈 #${TRACKING_ISSUE} 본문"
            echo '<UNTRUSTED_DATA source="issue-body">'
            cat /tmp/audit/issue-body.md
            echo '</UNTRUSTED_DATA>'
            echo
            echo "## diff (last-audit..HEAD)"
            echo '<UNTRUSTED_DATA source="diff">'
            echo '```diff'
            cat /tmp/audit/diff.patch
            echo '```'
            echo '</UNTRUSTED_DATA>'
          } > /tmp/audit/prompt.md
          wc -c /tmp/audit/prompt.md

      - name: OpenAI 키 프리플라이트
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿 값이 비어 있습니다. 시크릿을 재등록하세요."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/audit/preflight.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models)
          if [ "$STATUS" != "200" ]; then
            echo "::error::OpenAI 키 검증 실패 (HTTP $STATUS) — 키가 무효하거나 만료됨, 재발급 필요"
            cat /tmp/audit/preflight.json
            exit 1
          fi
          echo "OpenAI 키 유효 (HTTP 200)"

      - name: Codex 설치
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @openai/codex@0.145.0

      - name: Codex 인증 (API key)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: AI 점검 실행 (codex exec)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
            --model gpt-5.5 \
            --sandbox read-only \
            --skip-git-repo-check \
            --output-last-message /tmp/audit/result.md \
            - < /tmp/audit/prompt.md
          test -s /tmp/audit/result.md

      - name: 신규 항목 개별 이슈 생성
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/audit/created-issues.md

          # 보고서 말미의 기계 판독 블록에서 신규 항목만 추출
          awk '/^<!-- NEW-ITEMS-JSON$/{flag=1;next} /^-->$/{flag=0} flag' \
            /tmp/audit/result.md > /tmp/audit/new-items.json

          if ! jq -e 'type == "array"' /tmp/audit/new-items.json >/dev/null 2>&1; then
            echo "::warning::기계 판독 블록을 파싱하지 못했습니다. 이슈 생성을 건너뛰고 댓글만 등록합니다."
            exit 0
          fi

          COUNT=$(jq 'length' /tmp/audit/new-items.json)
          echo "신규 항목 ${COUNT}건"
          [ "$COUNT" -eq 0 ] && exit 0

          # 같은 항목 ID로 이미 만든 이슈가 있으면 건너뛴다(workflow_dispatch 재실행 대비)
          gh issue list --state all --limit 500 --json number,body \
            > /tmp/audit/existing-issues.json

          jq -c '.[]' /tmp/audit/new-items.json | while read -r item; do
            ID=$(jq -r '.id' <<<"$item")
            TITLE=$(jq -r '.title' <<<"$item")
            TAG=$(jq -r '.tag' <<<"$item")
            CONDITION=$(jq -r '.condition' <<<"$item")
            EVIDENCE=$(jq -r '.evidence' <<<"$item")
            DETAIL=$(jq -r '.detail' <<<"$item")
            MARKER="<!-- audit-item: ${ID} -->"

            DUP=$(jq -r --arg m "$MARKER" \
              '[.[] | select(.body != null and (.body | contains($m))) | .number] | first // empty' \
              /tmp/audit/existing-issues.json)
            if [ -n "$DUP" ]; then
              echo "${ID}: 이미 #${DUP}로 생성됨, 건너뜀"
              echo "- **${ID}** #${DUP} (기존)" >> /tmp/audit/created-issues.md
              continue
            fi

            case "$TAG" in
              Fix)      LABELS="FE,Fix" ;;
              Refactor) LABELS="FE,Refactor" ;;
              Feature)  LABELS="FE,Feature" ;;
              Infra)    LABELS="FE,Infra" ;;
              Docs)     LABELS="FE,Docs" ;;
              *)        LABELS="FE" ;;
            esac

            {
              echo "## 배경"
              echo
              echo "- 정기 코드 점검에서 신규 \`${ID}\`로 검출됐습니다."
              echo "- ${DETAIL}"
              echo "- 근거: \`${EVIDENCE}\`"
              echo "- 착수 조건: \`[${CONDITION}]\`"
              echo
              echo "## 작업 항목"
              echo
              echo "- [ ] \`${EVIDENCE}\` — ${DETAIL}"
              echo
              echo "## 완료 조건"
              echo
              echo "- [ ] \`${EVIDENCE}\` 위치의 지적 사항이 해소된다"
              echo "- [ ] \`pnpm typecheck\` · lint 통과"
              echo
              echo "---"
              echo
              echo "추적 이슈 #${TRACKING_ISSUE} · 자동 생성 ([워크플로 실행](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
              echo
              echo "$MARKER"
            } > /tmp/audit/issue-body.tmp.md

            URL=$(gh issue create \
              --title "[${TAG}] ${TITLE}" \
              --body-file /tmp/audit/issue-body.tmp.md \
              --label "$LABELS") || { echo "::warning::${ID} 이슈 생성 실패"; continue; }

            NUM="${URL##*/}"
            echo "${ID} → ${URL}"
            gh issue edit "$NUM" --add-assignee JuJangGwon >/dev/null 2>&1 \
              || echo "::warning::#${NUM} assignee 지정 실패(권한), 수동 지정 필요"
            echo "- **${ID}** #${NUM} \`[${CONDITION}]\` ${TITLE}" >> /tmp/audit/created-issues.md
          done

      - name: 점검 결과 이슈 댓글 등록
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_COUNT: ${{ steps.gate.outputs.count }}
        run: |
          {
            echo "## 🤖 정기 코드 점검 — last-audit 이후 ${AUDIT_COUNT}커밋 (${GITHUB_SHA::7})"
            echo
            # 기계 판독 블록은 이슈 생성에만 쓰이므로 댓글에서 걷어낸다
            awk '/^<!-- NEW-ITEMS-JSON$/{flag=1} /^-->$/{if(flag){flag=0;next}} !flag' \
              /tmp/audit/result.md
            if [ -s /tmp/audit/created-issues.md ]; then
              echo
              echo "### 생성된 이슈"
              echo
              cat /tmp/audit/created-issues.md
            fi
            echo
            echo "---"
            echo "_[워크플로 실행](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · codex exec_"
          } > /tmp/audit/comment.md
          gh issue comment "$TRACKING_ISSUE" --body-file /tmp/audit/comment.md

      - name: last-audit 태그 이동
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git tag -f last-audit HEAD
          git push -f origin last-audit
