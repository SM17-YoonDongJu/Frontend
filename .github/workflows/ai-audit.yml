name: AI Audit

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ai-audit
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

# 대장 이슈는 회차마다 새로 만든다. 현재 대장은 본문의
# <!-- audit-ledger round=N --> 표식으로 찾으므로 번호를 고정하지 않는다.
env:
  LEDGER_MARKER: "audit-ledger round="

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: last-audit 태그 확인 및 커밋 수 계산
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if ! git rev-parse -q --verify refs/tags/last-audit >/dev/null; then
            echo "last-audit 태그가 없어 현재 HEAD(${GITHUB_SHA})에 생성하고 종료합니다."
            git tag last-audit HEAD
            git push origin last-audit
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count last-audit..HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "last-audit 이후 커밋 수: $COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "20 미만이므로 AI 점검을 실행하지 않고 종료합니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 현재 대장 이슈 확인
        id: ledger
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/audit
          gh issue list --state open --limit 300 --json number,body > /tmp/audit/open-issues.json
          PREV=$(jq -r --arg m "$LEDGER_MARKER" \
            '[.[] | select(.body != null and (.body | contains($m)))] | sort_by(.number) | last | .number // empty' \
            /tmp/audit/open-issues.json)
          if [ -z "$PREV" ]; then
            echo "::error::열린 대장 이슈를 찾지 못했습니다. 본문 말미에 <!-- audit-ledger round=N --> 표식이 있는 이슈가 하나 필요합니다."
            exit 1
          fi
          gh issue view "$PREV" --json body -q .body > /tmp/audit/ledger-body.md
          ROUND=$(sed -n 's/.*audit-ledger round=\([0-9][0-9]*\).*/\1/p' /tmp/audit/ledger-body.md | tail -1)
          if [ -z "$ROUND" ]; then
            echo "::error::대장 이슈 #${PREV}에서 회차 번호를 읽지 못했습니다."
            exit 1
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "next=$((ROUND + 1))" >> "$GITHUB_OUTPUT"
          echo "직전 대장 #${PREV} (${ROUND}회차) → 이번 회차 $((ROUND + 1))"

      - name: 점검 컨텍스트 수집
        if: steps.gate.outputs.run == 'true'
        run: |
          # diff는 프롬프트 폭주 방지로 300KB에서 자른다 (잘리면 말미에 표식)
          git diff last-audit..HEAD > /tmp/audit/diff-full.patch
          head -c 300000 /tmp/audit/diff-full.patch > /tmp/audit/diff.patch
          if [ "$(wc -c < /tmp/audit/diff-full.patch)" -gt 300000 ]; then
            echo "... (diff가 300KB를 초과해 잘렸습니다. 필요 시 파일을 직접 읽어 확인)" >> /tmp/audit/diff.patch
          fi
          git diff --name-only --diff-filter=A last-audit..HEAD -- 'apps/web/src/app/**/page.tsx' > /tmp/audit/new-pages.txt
          git log -1 --format=%cs > /tmp/audit/head-date.txt
          echo "$(git rev-parse --short last-audit)..$(git rev-parse --short HEAD)" > /tmp/audit/range.txt

      - name: 프롬프트 조립
        if: steps.gate.outputs.run == 'true'
        env:
          AUDIT_COUNT: ${{ steps.gate.outputs.count }}
          PREV_LEDGER: ${{ steps.ledger.outputs.prev }}
        run: |
          {
            cat .github/ai-audit-prompt.md
            echo
            echo "---"
            echo
            echo "## 이번 점검 대상: $(cat /tmp/audit/range.txt) (${AUDIT_COUNT}커밋)"
            echo
            echo "회차 로그에 적을 날짜는 $(cat /tmp/audit/head-date.txt), 커밋 범위는 $(cat /tmp/audit/range.txt)다."
            echo
            echo "## 새로 추가된 page.tsx"
            if [ -s /tmp/audit/new-pages.txt ]; then cat /tmp/audit/new-pages.txt; else echo "(없음)"; fi
            echo
            echo "## 직전 회차 대장 이슈 #${PREV_LEDGER} 본문"
            echo '<UNTRUSTED_DATA source="issue-body">'
            cat /tmp/audit/ledger-body.md
            echo '</UNTRUSTED_DATA>'
            echo
            echo "## diff (last-audit..HEAD)"
            echo '<UNTRUSTED_DATA source="diff">'
            echo '```diff'
            cat /tmp/audit/diff.patch
            echo '```'
            echo '</UNTRUSTED_DATA>'
          } > /tmp/audit/prompt.md
          wc -c /tmp/audit/prompt.md

      - name: OpenAI 키 프리플라이트
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿 값이 비어 있습니다. 시크릿을 재등록하세요."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/audit/preflight.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models)
          if [ "$STATUS" != "200" ]; then
            echo "::error::OpenAI 키 검증 실패 (HTTP $STATUS) — 키가 무효하거나 만료됨, 재발급 필요"
            cat /tmp/audit/preflight.json
            exit 1
          fi
          echo "OpenAI 키 유효 (HTTP 200)"

      - name: Codex 설치
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @openai/codex@0.145.0

      - name: Codex 인증 (API key)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: AI 점검 실행 (codex exec)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
            --model gpt-5.5 \
            --sandbox read-only \
            --skip-git-repo-check \
            --output-last-message /tmp/audit/result.md \
            - < /tmp/audit/prompt.md
          test -s /tmp/audit/result.md

      - name: 새 회차 대장 이슈 생성
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_COUNT: ${{ steps.gate.outputs.count }}
          PREV_LEDGER: ${{ steps.ledger.outputs.prev }}
          NEXT_ROUND: ${{ steps.ledger.outputs.next }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            cat /tmp/audit/result.md
            echo
            echo "---"
            echo
            echo "직전 회차 대장 #${PREV_LEDGER} · 점검 범위 \`$(cat /tmp/audit/range.txt)\` (${AUDIT_COUNT}커밋) · [워크플로 실행](${RUN_URL})"
            echo
            echo "<!-- audit-ledger round=${NEXT_ROUND} -->"
          } > /tmp/audit/ledger-new.md

          URL=$(gh issue create \
            --title "[Docs] 정기 코드 점검 대장 ${NEXT_ROUND}기" \
            --body-file /tmp/audit/ledger-new.md \
            --label "FE,Docs")
          NEW="${URL##*/}"
          echo "새 대장 이슈 #${NEW}"

          gh issue edit "$NEW" --add-assignee JuJangGwon >/dev/null 2>&1 \
            || echo "::warning::#${NEW} assignee 지정 실패(권한), 수동 지정 필요"

          gh issue comment "$PREV_LEDGER" --body \
            "${NEXT_ROUND}기 대장 #${NEW}로 이어집니다. 미해결 항목은 그쪽 본문에 이월했습니다. ([워크플로 실행](${RUN_URL}))"
          gh issue close "$PREV_LEDGER" --reason completed

      - name: last-audit 태그 이동
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git tag -f last-audit HEAD
          git push -f origin last-audit
