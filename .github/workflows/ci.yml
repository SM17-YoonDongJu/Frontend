name: CI

on:
  pull_request:
  push:
    branches: [main, dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insurance/web lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insurance/web build
        env:
          # main/dev push에서만 소스맵 업로드 — PR 빌드는 토큰 미주입으로 자동 스킵
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  # 커밋된 스펙 스냅샷으로 재생성했을 때 생성물이 그대로인지 확인한다.
  # 생성물 직접 수정·스냅샷만 갱신하고 재생성 누락한 커밋을 잡는다. 네트워크를 타지 않음.
  api-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insurance/web generate:api
      - name: 생성물이 스냅샷과 일치하는지 확인
        run: git diff --exit-code -- apps/web/src/shared/api/generated

  # 807개 테스트를 6샤드로 분할 — 샤드당 고정비(설치·빌드) 약 1분 20초는 병렬로 겹친다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 한 샤드가 깨져도 나머지 결과를 끝까지 받는다.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright 버전 확인
        id: playwright-version
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-
      - name: Playwright 브라우저 설치 (chromium, webkit)
        run: pnpm --filter @insurance/web exec playwright install --with-deps chromium webkit
      - name: E2E 테스트 (샤드 ${{ matrix.shard }}/6)
        run: pnpm --filter @insurance/web exec playwright test --shard=${{ matrix.shard }}/6
      - name: blob 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 1

  # 샤드가 하나라도 실패했을 때만 blob을 합쳐 HTML 리포트를 만든다.
  # 성공 경로에는 붙지 않아 그린 PR의 소요 시간에 영향이 없다.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 샤드별 blob 리포트 내려받기
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/all-blob-reports
      - name: HTML 리포트 병합
        run: pnpm --filter @insurance/web exec playwright merge-reports --reporter html all-blob-reports
      - name: 실패 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
